<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Lark</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        :root {
            /* Colors from the app's default ColorTheme (GameColors.swift) */
            --correct: #008c00;
            --pun-solved: #1a2666;
            --pun-border: #00ff33;
            --joke-title: #2e5cb8;
            --idiom-title: #3373d9;
            --tile-border: #d1d1d6;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
            color: #1a1a1a;
        }

        /* Header sits in the top-left corner; the larks fill the space beside it */
        .page {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: start;
            gap: 1rem 2rem;
            padding: 1.5rem 1rem 2rem;
        }

        .site-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .site-header .tagline {
            margin-bottom: 1rem;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 900px;
            justify-self: center;
        }

        @media (max-width: 800px) {
            .page {
                grid-template-columns: minmax(0, 1fr);
            }

            .puzzle-card {
                padding: 1.25rem 0.75rem;
            }
        }

        .logo {
            width: min(267px, 47vw);
            height: auto;
            margin-bottom: 1rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .tagline {
            font-family: 'Didot', 'Bodoni MT', 'Times New Roman', Georgia, serif;
            font-size: clamp(0.85rem, 2.5vw, 1.1rem);
            font-style: italic;
            color: #1a1a1a;
            margin-bottom: 2.5rem;
            letter-spacing: 0.05em;
        }

        .store-badges {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .store-badges a img {
            height: clamp(40px, 8vw, 54px);
            transition: opacity 0.2s;
        }

        .store-badges a:hover img {
            opacity: 0.7;
        }

        /* ---------- Yesterday's larks ---------- */

        .larks {
            margin-top: 0;
        }

        .larks-day + .larks-day {
            margin-top: 3.5rem;
        }

        .larks-heading {
            margin-bottom: 0.4rem;
        }

        .larks-date {
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 2rem;
        }

        .lark-cards {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .lark-card {
            --gap: 2px;
            flex: 0 1 380px;
            padding: 1.5rem 1.25rem;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .card-labels {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Word label: letter boxes, like LARK / DAILY on the app's card */
        .word-label {
            display: flex;
            gap: 2px;
        }

        .word-label span {
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--joke-title);
            color: #fff;
            font: 700 14px ui-monospace, 'SF Mono', Menlo, monospace;
            border-radius: 1px;
        }

        .word-label.size span {
            background: #1a1a1a;
        }

        .type-label {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .setup {
            font-family: 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
            font-weight: 900;
            font-size: clamp(1.05rem, 3.5vw, 1.25rem);
            line-height: 1.3;
            color: var(--pun-solved);
        }

        .punchline {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 10px;
        }

        .token {
            display: flex;
            gap: 1.5px;
        }

        .token span {
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font: 700 14px ui-monospace, 'SF Mono', Menlo, monospace;
            border-radius: 2px;
        }

        .token.content span {
            background: var(--pun-solved);
            color: #fff;
            border: 1px solid var(--pun-border);
        }

        .token.filler span {
            color: #1a1a1a;
            opacity: 0.55;
            width: auto;
            padding: 0 1px;
        }

        /* Solved grid */
        .grid-wrap {
            position: relative;
            margin-top: 0.25rem;
        }

        .grid {
            display: grid;
            gap: var(--gap);
        }

        .cell {
            width: var(--tile);
            height: var(--tile);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 1px;
            background: var(--correct);
            color: #fff;
            border: 0.5px solid var(--tile-border);
            font: 700 calc(var(--tile) * 0.62) ui-monospace, 'SF Mono', Menlo, monospace;
        }

        .cell.pun {
            background: var(--pun-solved);
        }

        .cell.black {
            background: #000;
            border-color: #000;
        }

        .cell .num {
            position: absolute;
            top: 1px;
            left: 2px;
            font: 400 calc(var(--tile) * 0.22) -apple-system, 'Helvetica Neue', Arial, sans-serif;
            color: rgba(255, 255, 255, 0.7);
        }

        .pun-outline {
            position: absolute;
            border: 1px solid var(--pun-border);
            pointer-events: none;
        }

        .explanation {
            font-size: 0.8rem;
            line-height: 1.45;
            opacity: 0.6;
            font-style: italic;
            max-width: 32ch;
        }

        /* ---------- Today's puzzles (blank grid + clues) ---------- */

        .today {
            margin-bottom: 4rem;
        }

        .today-cards {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .puzzle-card {
            --gap: 2px;
            width: 100%;
            max-width: 820px;
            padding: 1.5rem 1.25rem;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .puzzle-card .card-labels {
            max-width: 520px;
        }

        .puzzle-body {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 1.75rem;
            flex-wrap: wrap;
            margin-top: 0.25rem;
        }

        .cell.blank {
            background: #fff;
            color: #1a1a1a;
        }

        .cell.blank.pun {
            background: rgba(0, 140, 0, 0.12);
        }

        .cell.blank .num {
            color: #6e6e73;
        }

        .token.hint span {
            background: rgba(0, 140, 0, 0.12);
            border: 1px solid var(--pun-border);
        }

        .token.star span {
            font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
            font-size: 18px;
        }

        .clues {
            flex: 1 1 260px;
            max-width: 420px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr));
            gap: 1.25rem;
            text-align: left;
        }

        .clues h3 {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding-bottom: 0.35rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #1a1a1a;
        }

        .clues ol {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .clues li {
            display: grid;
            grid-template-columns: 1.75rem 1fr;
            font-size: 0.85rem;
            line-height: 1.35;
        }

        .clues li b {
            font-weight: 700;
        }

        .clues li.pun span {
            color: var(--correct);
            font-style: italic;
        }

        .today-note {
            margin-top: 1.5rem;
            font-size: clamp(0.75rem, 2vw, 0.85rem);
            opacity: 0.6;
        }

        /* ---------- Visitor counter ---------- */

        .counter {
            margin-top: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }

        .counter-digits {
            display: flex;
            gap: 3px;
        }

        .counter-digits span {
            width: clamp(22px, 6vw, 30px);
            height: clamp(30px, 8vw, 40px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: #fff;
            font: 700 clamp(1rem, 4vw, 1.35rem) ui-monospace, 'SF Mono', Menlo, monospace;
            border-radius: 3px;
        }

        .counter-label {
            font-size: clamp(0.65rem, 1.8vw, 0.75rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="page">
    <header class="site-header">
        <img src="logo.png" alt="Daily Lark" class="logo">
        <p class="tagline">... now available on the App Store ...</p>
        <div class="store-badges">
            <a href="https://apps.apple.com/app/id6761080561" aria-label="Download on the App Store">
                <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
            </a>
        </div>
    </header>

    <div class="container">

        <section class="today" id="today" hidden></section>

        <section class="larks" id="larks" hidden></section>

        <div class="counter" id="counter" hidden>
            <div class="counter-digits" id="counter-digits"></div>
            <p class="counter-label">visitors</p>
        </div>

        <p class="tagline" style="margin-top: 4rem; margin-bottom: 0.5rem; font-style: normal; font-size: clamp(0.7rem, 2vw, 0.85rem); opacity: 0.5;">Daily-Lark.com&trade; &copy; 2026</p>
        <p style="font-size: clamp(0.65rem, 1.5vw, 0.75rem); opacity: 0.4;"><a href="/privacy" style="color: #1a1a1a; text-decoration: none;">Privacy Policy</a> &nbsp;&middot;&nbsp; <a href="/terms" style="color: #1a1a1a; text-decoration: none;">Terms of Service</a></p>
    </div>
    </div>

    <script>
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        function letterBoxes(text, className) {
            const wrap = el('div', className);
            for (const ch of text) wrap.appendChild(el('span', null, ch));
            return wrap;
        }

        function renderGrid(p) {
            const wrap = el('div', 'grid-wrap');
            const grid = el('div', 'grid');
            grid.style.gridTemplateColumns = `repeat(${p.cols}, var(--tile))`;

            for (const row of p.cells) {
                for (const cell of row) {
                    if (!cell) {
                        grid.appendChild(el('div', 'cell black'));
                        continue;
                    }
                    const cls = (cell.l ? 'cell' : 'cell blank') + (cell.j ? ' pun' : '');
                    const c = el('div', cls, cell.l);
                    if (cell.n) c.appendChild(el('span', 'num', cell.n));
                    grid.appendChild(c);
                }
            }
            wrap.appendChild(grid);

            // One neon outline per pun word, like PlayerPuzzlePreview
            for (const w of p.jokeWords) {
                const o = el('div', 'pun-outline');
                const step = 'calc(var(--tile) + var(--gap))';
                const span = `calc(${w.len} * (var(--tile) + var(--gap)) - var(--gap))`;
                o.style.left = `calc(${w.col} * ${step})`;
                o.style.top = `calc(${w.row} * ${step})`;
                o.style.width = w.dir === 'across' ? span : 'var(--tile)';
                o.style.height = w.dir === 'across' ? 'var(--tile)' : span;
                wrap.appendChild(o);
            }
            return wrap;
        }

        function renderCard(p) {
            const card = el('article', 'lark-card');
            // Scale tiles so wide grids still fit a phone screen
            card.style.setProperty('--tile', `clamp(24px, calc((100vw - 100px) / ${p.cols}), 44px)`);

            const labels = el('div', 'card-labels');
            labels.appendChild(letterBoxes(p.label.toUpperCase(), 'word-label'));
            labels.appendChild(el('span', 'type-label', `${p.typeEmoji} ${p.typeLabel}`));
            labels.appendChild(letterBoxes(`${p.rows}X${p.cols}`, 'word-label size'));
            card.appendChild(labels);

            card.appendChild(el('p', 'setup', p.setup));

            const punch = el('div', 'punchline');
            punch.setAttribute('aria-label', p.punchline);
            for (const t of p.tokens) {
                punch.appendChild(letterBoxes(t.t, t.c ? 'token content' : 'token filler'));
            }
            card.appendChild(punch);

            card.appendChild(renderGrid(p));
            if (p.explanation) card.appendChild(el('p', 'explanation', p.explanation));
            return card;
        }

        function renderClues(p) {
            const clues = el('div', 'clues');
            for (const dir of ['across', 'down']) {
                const col = el('div');
                col.appendChild(el('h3', null, dir));
                const list = el('ol');
                for (const c of p.clues[dir]) {
                    const li = el('li', c.pun ? 'pun' : null);
                    li.appendChild(el('b', null, c.n));
                    li.appendChild(el('span', null, c.clue ?? `Punchline word (${c.len}) · solve the crossings`));
                    list.appendChild(li);
                }
                col.appendChild(list);
                clues.appendChild(col);
            }
            return clues;
        }

        function renderPuzzleCard(p) {
            const card = el('article', 'puzzle-card');
            card.style.setProperty('--tile', `clamp(24px, calc((100vw - 100px) / ${p.cols}), 44px)`);

            const labels = el('div', 'card-labels');
            labels.appendChild(letterBoxes(p.label.toUpperCase(), 'word-label'));
            labels.appendChild(el('span', 'type-label', `${p.typeEmoji} ${p.typeLabel}`));
            labels.appendChild(letterBoxes(`${p.rows}X${p.cols}`, 'word-label size'));
            card.appendChild(labels);

            card.appendChild(el('p', 'setup', p.setup));

            // Blank punchline: boxes for pun words, ✱ for filler words (as in the app)
            const punch = el('div', 'punchline');
            for (const t of p.tokens) {
                punch.appendChild(t.filler ? letterBoxes('✱', 'token star') : letterBoxes(' '.repeat(t.len), 'token hint'));
            }
            card.appendChild(punch);

            const body = el('div', 'puzzle-body');
            body.appendChild(renderGrid(p));
            body.appendChild(renderClues(p));
            card.appendChild(body);
            return card;
        }

        function chicagoDate(offsetDays) {
            const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
            const [y, m, d] = today.split('-').map(Number);
            return new Date(Date.UTC(y, m - 1, d + offsetDays)).toISOString().slice(0, 10);
        }

        function longDate(iso) {
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        }

        function renderToday(today) {
            // Only show "today" while it really is today in US Central
            if (!today || today.date !== chicagoDate(0)) return;
            const section = document.getElementById('today');
            section.appendChild(el('p', 'tagline larks-heading', "... today's larks ..."));
            section.appendChild(el('p', 'larks-date', longDate(today.date)));
            const cards = el('div', 'today-cards');
            const ordered = [...today.puzzles].sort((a, b) => b.slot - a.slot);
            for (const p of ordered) cards.appendChild(renderPuzzleCard(p));
            section.appendChild(cards);
            section.appendChild(el('p', 'today-note', 'Solve them in the app. The answers show up here tomorrow.'));
            section.hidden = false;
        }

        async function loadLarks() {
            try {
                const res = await fetch('larks.json', { cache: 'no-cache' });
                if (!res.ok) return;
                const data = await res.json();
                renderToday(data.today);

                // Only say "yesterday" if the daily export is current (US Central)
                const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
                const [ty, tm, td] = today.split('-').map(Number);
                const yesterday = new Date(Date.UTC(ty, tm - 1, td - 1)).toISOString().slice(0, 10);
                const current = data.days[0].date === yesterday;
                const headings = current
                    ? ["... yesterday's larks ...", '... the day before ...']
                    : ['... recent larks ...', ''];

                const section = document.getElementById('larks');
                data.days.forEach((day, i) => {
                    const block = el('div', 'larks-day');
                    if (headings[i]) block.appendChild(el('p', 'tagline larks-heading', headings[i]));
                    const [y, m, d] = day.date.split('-').map(Number);
                    block.appendChild(el('p', 'larks-date',
                        new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })));
                    const cards = el('div', 'lark-cards');
                    // Daily first, then the Lark
                    const ordered = [...day.puzzles].sort((a, b) => b.slot - a.slot);
                    for (const p of ordered) cards.appendChild(renderCard(p));
                    block.appendChild(cards);
                    section.appendChild(block);
                });
                document.getElementById('larks').hidden = false;
            } catch (e) {
                // Leave the section hidden if the data can't be loaded
            }
        }

        function showVisitorCount(count) {
            const digits = document.getElementById('counter-digits');
            digits.replaceChildren(...String(count).padStart(6, '0').split('').map(ch => el('span', null, ch)));
            document.getElementById('counter').hidden = false;
        }

        loadLarks();
    </script>
</body>
</html>
